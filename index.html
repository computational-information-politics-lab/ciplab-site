<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Computational Information Politics Lab</title>
<meta name="description" content="Computational Information Politics Lab. Our work: Election Tracker 2026.">
<meta name="theme-color" content="#ffffff">
<meta property="og:title" content="Computational Information Politics Lab">
<meta property="og:description" content="Our work: Election Tracker 2026.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ciplab.org">
<meta name="twitter:card" content="summary">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#ffffff; --ink:#1f1f1f; --ink2:#5f6368; --ink3:#6b7075;
    --tint:#f6f7f8; --tint-hover:#eef0f2; --focus:#1f1f1f;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--ground); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    display:flex; align-items:center; justify-content:center; padding:2rem 1rem;
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  }
  .wrap{max-width:820px; width:100%}
  h1{
    font-family:"Source Serif 4",Georgia,"Times New Roman",serif;
    font-weight:700; font-size:clamp(1.75rem,4.6vw,2.75rem); line-height:1.1; letter-spacing:-.01em;
    margin:0 0 2.5rem; text-wrap:balance;
  }
  @media (min-width:900px){h1{white-space:nowrap}}
  .card{
    display:flex; align-items:center; justify-content:space-between; gap:1rem;
    padding:1.25rem 1.5rem; background:var(--tint); border-radius:16px;
    text-decoration:none; color:inherit; transition:background-color .15s ease;
  }
  .card:hover{background:var(--tint-hover)}
  .card:focus-visible{outline:2px solid var(--focus); outline-offset:3px}
  .card .t{font-size:1.0625rem; font-weight:600}
  .card .arrow{font-size:1.25rem; flex-shrink:0; transition:transform .15s ease}
  .card:hover .arrow{transform:translateX(3px)}
  .foot{margin-top:3rem; font-size:.8125rem; color:var(--ink3)}
  @media (prefers-reduced-motion:reduce){.card,.card .arrow{transition:none}.card:hover .arrow{transform:none}}
</style>
</head>
<body>
  <main class="wrap">
    <h1>Computational Information Politics Lab</h1>
    <a class="card" href="https://election.ciplab.org">
      <span class="t">Election Tracker 2026</span>
      <span class="arrow" aria-hidden="true">&rarr;</span>
    </a>
    <p class="foot">&copy; 2026 Computational Information Politics Lab</p>
  </main>
</body>
</html>
